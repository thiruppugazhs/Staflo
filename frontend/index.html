<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Work+Sans:wght@600;700;800;900&display=swap" rel="stylesheet" />
    <title>Staflo — Every workday, perfectly aligned.</title>
    <script>
      (function(){
        try{
          var raw = localStorage.getItem('staflo-theme-store');
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed && parsed.state) {
              if (parsed.state.themeId) {
                document.documentElement.setAttribute('data-theme', parsed.state.themeId);
              }
              if (parsed.state.isDark) {
                document.documentElement.classList.add('dark');
              }
            }
          }
        }catch(e){}
      })();
    </script>
  </head>
  <body class="bg-background text-foreground antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
