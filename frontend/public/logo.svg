<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Staflo logo">
  <!-- Staflo - Modern Flow S/D Emblem -->
  <rect width="64" height="64" rx="16" fill="#004E72"/>
  <!-- primary flowing stroke -->
  <path d="M20 16 V48" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
  <!-- upper flow accent -->
  <path d="M20 16 C34 16, 44 21, 44 28 C44 35, 34 38, 20 38" fill="none" stroke="#FF6E42" stroke-width="8" stroke-linecap="round"/>
  <!-- bottom flow -->
